<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WL Leads - Painel de Controle</title>
    <link rel="icon" type="image/png" href="img/escudo_shiel.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            justify-content: flex-start; 
            flex-direction: column; 
            padding: 40px 20px;
            background-color: #0a0c10;
            color: #fff;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .admin-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            color: #e0e0e0;
            min-width: 1000px;
        }
        th, td { 
            padding: 12px 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            text-align: left; 
        }
        th { 
            background: rgba(0, 255, 255, 0.1); 
            color: #00FFFF; 
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .badge { 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 0.75rem; 
            font-weight: bold; 
        }
        .critico { background: #FF4444; color: white; }
        .aplus { background: #00FF00; color: black; }
        .alerta { background: #FFFF00; color: black; }
        
        .refresh-btn {
            background: #FFB300;
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 20px;
            font-family: 'Rajdhani', sans-serif;
        }

        /* ESTILOS NOVOS PARA IA */
        .btn-ia { background: #8E44AD; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.7rem; }
        .config-area { margin-bottom: 20px; background: rgba(0, 255, 255, 0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(0, 255, 255, 0.1); }
        #modalIA { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal-content { background: #1a1c23; margin: 5% auto; padding: 30px; border: 1px solid #00FFFF; width: 60%; border-radius: 12px; }
        textarea { width: 100%; height: 250px; background: #000; color: #00FF00; border: 1px solid #333; padding: 15px; font-family: monospace; margin-top: 15px; resize: none; }

        #loginArea { 
            text-align: center; 
            margin-top: 100px; 
            max-width: 350px; 
            margin-left: auto; 
            margin-right: auto;
            background: rgba(255,255,255,0.02);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid rgba(0,255,255,0.1);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 4px;
            border: 1px solid #00FFFF;
            background: #000;
            color: #fff;
            box-sizing: border-box;
        }
        #mainContent { display: none; }
    </style>
</head>
<body>

    <div id="loginArea">
        <h2 style="color: #00FFFF; margin-bottom: 20px;">🛡️ WL Admin</h2>
        <input type="email" id="emailInput" placeholder="E-mail do Administrador">
        <input type="password" id="passInput" placeholder="Senha">
        <button onclick="verificarLogin()" class="refresh-btn" style="width: 100%; margin-top: 10px;">Entrar no Painel</button>
    </div>

    <div id="mainContent" class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 style="color: #00FFFF; margin-bottom: 5px;">🚀 WL Leads</h2>
                <p style="margin-bottom: 30px; color: #888;">Base de Inteligência Longo Shield</p>
            </div>
            <button onclick="logout()" style="background:none; border:none; color:#FF4444; cursor:pointer; text-decoration:underline;">Sair com segurança</button>
        </div>

        <div class="config-area">
            <small style="color: #00FFFF; font-weight: bold;">CHAVE DE API GEMINI:</small>
            <input type="password" id="geminiKey" placeholder="Cole sua API Key do AI Studio aqui" style="margin-top: 5px; width: 350px; display: block;">
        </div>
        
        <button class="refresh-btn" onclick="carregarLeads()">🔄 Atualizar Base</button>

        <div class="admin-card">
            <table>
                <thead>
                    <tr>
                        <th>Data/Hora</th>
                        <th>Domínio</th>
                        <th>Status</th>
                        <th>SSL/Reputação</th>
                        <th>Plataforma</th>
                        <th>Ação IA</th>
                    </tr>
                </thead>
                <tbody id="tabelaLeads">
                    <tr><td colspan="6" style="text-align: center;">Aguardando autorização...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modalIA">
        <div class="modal-content">
            <h3 style="color: #00FFFF; margin-top: 0;">🤖 Analista Sênior IA</h3>
            <p id="statusIA" style="font-size: 0.8rem; color: #888;">Processando dados do domínio...</p>
            <textarea id="textoProposta" readonly></textarea>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="copiarTexto()" class="refresh-btn" style="background:#2ecc71;">Copiar Proposta</button>
                <button onclick="fecharModal()" class="refresh-btn" style="background:#555;">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://giikoiqpnzgmhcqiuvhs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_dtsJRRjhIKGt3OMakg4gUQ_4K0LviLB';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function escapeHTML(str) {
            if (!str) return '---';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) { mostrarPainel(); }
        };

        async function verificarLogin() {
            const email = document.getElementById('emailInput').value;
            const senha = document.getElementById('passInput').value;
            const { error } = await _supabase.auth.signInWithPassword({ email, password: senha });
            if (error) alert("Acesso Negado: " + error.message);
            else mostrarPainel();
        }

        function mostrarPainel() {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            carregarLeads();
        }

        async function logout() { await _supabase.auth.signOut(); location.reload(); }

        async function carregarLeads() {
            const corpoTabela = document.getElementById('tabelaLeads');
            const { data, error } = await _supabase.from('leads').select('*').order('created_at', { ascending: false });

            if (error) {
                corpoTabela.innerHTML = `<tr><td colspan="6" style="color: red;">Erro de permissão.</td></tr>`;
                return;
            }

            corpoTabela.innerHTML = '';
            data.forEach(lead => {
                const dataHora = new Date(lead.created_at).toLocaleString('pt-BR');
                let classeScore = (lead.score === 'A+') ? 'aplus' : (lead.score === 'Crítico' ? 'critico' : 'alerta');

                // Criamos uma linha na tabela e um botão que envia os dados do lead para a IA
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-size: 0.75rem; color: #777;">${dataHora}</td>
                    <td style="font-weight: bold; color: #00FFFF;">${escapeHTML(lead.dominio)}</td>
                    <td><span class="badge ${classeScore}">${escapeHTML(lead.score)}</span></td>
                    <td style="font-size: 0.85rem;">SSL: ${escapeHTML(lead.status_ssl)}<br>REP: ${escapeHTML(lead.reputacao)}</td>
                    <td style="font-size: 0.85rem;">${escapeHTML(lead.plataforma)}</td>
                    <td><button class="btn-ia" onclick='gerarPropostaIA(${JSON.stringify(lead)})'>✨ ANALISAR</button></td>
                `;
                corpoTabela.appendChild(tr);
            });
        }

        // FUNÇÃO PARA FALAR COM O GEMINI
        async function gerarPropostaIA(lead) {
            const apiKey = document.getElementById('geminiKey').value.trim();
            if (!apiKey) return alert("Por favor, cole sua API KEY!");

            document.getElementById('modalIA').style.display = 'block';
            document.getElementById('statusIA').innerText = "Conectando ao Gemini 2.5 Flash...";
            document.getElementById('textoProposta').value = "Redigindo...";

            const prompt = `Aja como Wiliam Longo, especialista em Cibersegurança da WL TEC. 
            Escreva uma proposta curta para o site ${lead.dominio}. 
            Dados: Score ${lead.score}, SSL ${lead.status_ssl}, Reputação ${lead.reputacao}.`;

            try {
                // Ajustado para o seu modelo 2.5 e apiVersion v1
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const resJson = await response.json();

                if (resJson.error) {
                    throw new Error(resJson.error.message);
                }

                const texto = resJson.candidates[0].content.parts[0].text;
                document.getElementById('textoProposta').value = texto;
                document.getElementById('statusIA').innerText = "Proposta gerada!";
            } catch (e) {
                console.error(e);
                alert("Erro: " + e.message);
                fecharModal();
            }
        }

        function fecharModal() { document.getElementById('modalIA').style.display = 'none'; }
        function copiarTexto() { 
            const area = document.getElementById('textoProposta');
            area.select();
            document.execCommand('copy');
            alert("Copiado!");
        }
    </script>
</body>
</html>
