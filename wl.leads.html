<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://giikoiqpnzgmhcqiuvhs.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*; connect-src 'self' https://* https://giikoiqpnzgmhcqiuvhs.supabase.co https://generativelanguage.googleapis.com https://dns.google; frame-src 'none'; form-action 'self'; base-uri 'self';">
    <title>WL CRM - Painel de Leads</title>
    <link rel="icon" type="image/png" href="img/escudo_shiel.png">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        :root { --bg-dark: #0a0c10; --cyan: #00FFFF; --ambar: #FFB300; --text-light: #e0e0e0; --gray-steel: #4a4a4a; --card-bg: rgba(255,255,255,0.03); --purple: #8E44AD; --green: #2ecc71; --red: #FF4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: var(--text-light); font-family: 'Roboto', sans-serif; padding: 20px; min-height: 100vh; }
        .container { max-width: 1500px; margin: 0 auto; }

        /* Login */
        #loginArea { text-align: center; margin-top: 80px; max-width: 380px; margin-left: auto; margin-right: auto; background: var(--card-bg); padding: 40px 30px; border-radius: 12px; border: 1px solid rgba(0,255,255,0.15); box-shadow: 0 0 30px rgba(0,255,255,0.05); }
        #loginArea h2 { color: var(--cyan); font-family: 'Rajdhani', sans-serif; margin-bottom: 20px; font-size: 1.8rem; }
        #loginArea input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid rgba(0,255,255,0.3); background: #000; color: #fff; font-size: 0.95rem; outline: none; }
        #loginArea input:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,255,255,0.2); }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(0,255,255,0.1); }
        .header h2 { color: var(--cyan); font-family: 'Rajdhani', sans-serif; font-size: 1.6rem; }
        .header-actions { display: flex; gap: 10px; align-items: center; }

        /* Stats */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 16px; text-align: center; }
        .stat-card .num { font-size: 2rem; font-weight: 900; font-family: 'Rajdhani', sans-serif; }
        .stat-card .label { font-size: 0.75rem; color: #777; text-transform: uppercase; margin-top: 4px; }

        /* Config */
        .config-area { margin-bottom: 15px; background: rgba(0,255,255,0.04); padding: 12px 15px; border-radius: 8px; border: 1px solid rgba(0,255,255,0.1); display: flex; align-items: center; gap: 10px; }
        .config-area small { color: var(--cyan); white-space: nowrap; font-family: 'Rajdhani', sans-serif; }
        .config-area input { flex: 1; max-width: 400px; padding: 8px 12px; border-radius: 4px; border: 1px solid #333; background: #000; color: #fff; font-size: 0.85rem; outline: none; }

        /* Table */
        .admin-card { background: var(--card-bg); border: 1px solid rgba(0,255,255,0.1); border-radius: 8px; padding: 15px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; color: var(--text-light); min-width: 1200px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); text-align: left; font-size: 0.8rem; }
        th { background: rgba(0,255,255,0.08); color: var(--cyan); font-family: 'Rajdhani', sans-serif; text-transform: uppercase; font-size: 0.72rem; position: sticky; top: 0; }
        tr:hover { background: rgba(0,255,255,0.03); }

        /* Badges */
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; display: inline-block; }
        .critico { background: var(--red); color: white; }
        .aplus { background: var(--green); color: black; }
        .alerta { background: var(--ambar); color: black; }
        .badge-ssl-ok { background: rgba(46,204,113,0.15); color: var(--green); border: 1px solid rgba(46,204,113,0.3); }
        .badge-ssl-fail { background: rgba(255,68,68,0.15); color: var(--red); border: 1px solid rgba(255,68,68,0.3); }
        .badge-email { background: rgba(0,255,255,0.1); color: var(--cyan); border: 1px solid rgba(0,255,255,0.2); font-size: 0.72rem; padding: 2px 6px; }

        /* Buttons */
        .btn { border: none; padding: 8px 16px; font-weight: bold; cursor: pointer; border-radius: 4px; font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; text-transform: uppercase; transition: 0.2s; }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: var(--ambar); color: #000; }
        .btn-ia { background: var(--purple); color: white; padding: 5px 10px; font-size: 0.7rem; }
        .btn-ia:hover { background: #a15dc4; box-shadow: 0 0 10px rgba(142,68,173,0.4); }
        .btn-ver { background: rgba(0,255,255,0.15); color: var(--cyan); border: 1px solid rgba(0,255,255,0.3); padding: 5px 10px; font-size: 0.7rem; }
        .btn-ver:hover { background: rgba(0,255,255,0.25); box-shadow: 0 0 10px rgba(0,255,255,0.3); }
        .btn-danger { background: none; border: none; color: var(--red); cursor: pointer; font-size: 0.85rem; }
        .btn-copy { background: var(--green); color: #000; }
        .btn-close { background: #555; color: #fff; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(4px); }
        .modal-box { background: #1a1c23; margin: 4% auto; padding: 30px; border: 1px solid var(--cyan); width: 65%; max-width: 800px; border-radius: 12px; max-height: 85vh; overflow-y: auto; box-shadow: 0 0 40px rgba(0,255,255,0.1); }
        .modal-box h3 { color: var(--cyan); font-family: 'Rajdhani', sans-serif; margin-bottom: 5px; font-size: 1.3rem; }
        .modal-box .subtitle { font-size: 0.8rem; color: #888; margin-bottom: 15px; }

        /* Textarea for IA */
        textarea { width: 100%; height: 280px; background: #000; color: #00FF00; border: 1px solid #333; padding: 15px; font-family: 'Roboto Mono', monospace; font-size: 0.85rem; margin-top: 10px; resize: vertical; border-radius: 6px; outline: none; }
        textarea:focus { border-color: var(--cyan); }

        /* Markdown rendered content */
        .md-content { background: #0d0f14; border: 1px solid rgba(0,255,255,0.1); border-radius: 8px; padding: 20px 25px; margin-top: 10px; line-height: 1.7; font-size: 0.9rem; max-height: 55vh; overflow-y: auto; }
        .md-content h1, .md-content h2, .md-content h3 { color: var(--cyan); font-family: 'Rajdhani', sans-serif; margin-top: 15px; }
        .md-content p { margin-bottom: 10px; }
        .md-content strong { color: var(--ambar); }
        .md-content ul, .md-content ol { padding-left: 20px; margin-bottom: 10px; }
        .md-content li { margin-bottom: 5px; }
        .md-content code { background: rgba(0,255,255,0.08); padding: 2px 6px; border-radius: 3px; color: var(--cyan); font-size: 0.85em; }
        .md-content blockquote { border-left: 3px solid var(--ambar); padding-left: 15px; color: #aaa; margin: 10px 0; }
        .md-content hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0; }

        .modal-actions { margin-top: 20px; display: flex; gap: 10px; }

        /* Responsive */
        @media (max-width: 768px) {
            .modal-box { width: 95%; margin: 2% auto; padding: 20px; }
            .header { flex-direction: column; gap: 10px; }
            .config-area { flex-direction: column; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: rgba(0,255,255,0.3); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginArea">
        <h2>🛡️ WL CRM</h2>
        <p style="color:#777; font-size:0.85rem; margin-bottom:20px;">Painel de Gestão de Leads</p>
        <input type="email" id="emailInput" placeholder="E-mail">
        <input type="password" id="passInput" placeholder="Senha">
        <button onclick="verificarLogin()" class="btn btn-primary" style="width:100%; margin-top:10px; padding:12px;">Entrar</button>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="mainContent" class="container" style="display:none;">
        <div class="header">
            <h2>🚀 WL CRM — Gestão de Leads</h2>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="carregarLeads()">🔄 Atualizar</button>
                <button class="btn-danger" onclick="logout()">Sair</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card"><div class="num" id="statTotal" style="color:var(--cyan);">0</div><div class="label">Total Leads</div></div>
            <div class="stat-card"><div class="num" id="statCriticos" style="color:var(--red);">0</div><div class="label">Críticos</div></div>
            <div class="stat-card"><div class="num" id="statEmails" style="color:var(--ambar);">0</div><div class="label">Com E-mail</div></div>
            <div class="stat-card"><div class="num" id="statPropostas" style="color:var(--green);">0</div><div class="label">Propostas</div></div>
        </div>

        <!-- Config IA -->
        <div class="config-area" id="areaConfigIA">
            <small>CHAVE GEMINI:</small>
            <input type="password" id="geminiKey" placeholder="Cole sua API Key (preenchida automaticamente se configurada)">
        </div>

        <!-- Tabela -->
        <div class="admin-card">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Domínio</th>
                        <th>Score</th>
                        <th>SSL</th>
                        <th>Reputação</th>
                        <th>Velocidade</th>
                        <th>Plataforma</th>
                        <th>IP / Local</th>
                        <th>E-mail</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaLeads"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL IA (Gerar proposta) -->
    <div id="modalIA" class="modal-overlay">
        <div class="modal-box">
            <h3>🤖 Analista Sênior IA</h3>
            <p id="statusIA" class="subtitle">Aguardando...</p>
            <textarea id="textoProposta" readonly></textarea>
            <div class="modal-actions">
                <button onclick="copiarTexto()" class="btn btn-copy">📋 Copiar</button>
                <button onclick="fecharModalIA()" class="btn btn-close">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL VER PROPOSTA (Leitura Markdown) -->
    <div id="modalVer" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalVerTitulo">📄 Proposta Comercial</h3>
            <p id="modalVerSubtitle" class="subtitle"></p>
            <div id="modalVerConteudo" class="md-content"></div>
            <div class="modal-actions">
                <button onclick="enviarEmail()" class="btn" style="background:#8E44AD; color:white;">📩 Enviar E-mail</button>
                <button onclick="copiarProposta()" class="btn btn-copy">📋 Copiar</button>
                <button onclick="regenerarProposta()" class="btn btn-ia" style="padding:8px 16px; font-size:0.8rem;">🔄 Regenerar</button>
                <button onclick="fecharModalVer()" class="btn btn-close">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://giikoiqpnzgmhcqiuvhs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_dtsJRRjhIKGt3OMakg4gUQ_4K0LviLB';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let CHAVE_IA_AUTOMATICA = "";
        let _leadsCache = [];
        let _leadAtual = null;

        // Utilidade anti-XSS: escapa HTML de dados vindos do banco
        function escapeHTML(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // ========== AUTH ==========
        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                mostrarPainel();
                try {
                    const { data } = await _supabase.from('config_privada').select('chave_valor').eq('chave_nome', 'GEMINI_API_KEY').single();
                    if (data) {
                        CHAVE_IA_AUTOMATICA = data.chave_valor;
                        document.getElementById('areaConfigIA').style.display = 'none';
                    }
                } catch(e) {}
            }
        };

        async function verificarLogin() {
            const email = document.getElementById('emailInput').value;
            const senha = document.getElementById('passInput').value;
            const { error } = await _supabase.auth.signInWithPassword({ email, password: senha });
            if (error) alert("Erro: " + error.message);
            else { mostrarPainel(); location.reload(); }
        }

        function mostrarPainel() {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            carregarLeads();
        }

        async function logout() { await _supabase.auth.signOut(); location.reload(); }

        // ========== CARREGAR LEADS ==========
        async function carregarLeads() {
            const corpo = document.getElementById('tabelaLeads');
            const { data, error } = await _supabase.from('leads').select('*').order('created_at', { ascending: false });
            if (error) { console.error(error); return; }

            _leadsCache = data || [];
            atualizarStats(_leadsCache);
            corpo.innerHTML = '';

            _leadsCache.forEach(lead => {
                const dtOriginal = new Date(lead.created_at);
                const dt = dtOriginal.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
                const classeScore = lead.score === 'A+' ? 'aplus' : (lead.score === 'Crítico' ? 'critico' : 'alerta');
                const sslClass = (lead.status_ssl === 'Ativo') ? 'badge-ssl-ok' : 'badge-ssl-fail';
                const temProposta = lead.detalhes_tecnicos && lead.detalhes_tecnicos.trim().length > 0;
                const leadJson = JSON.stringify(lead).replace(/'/g, '&#39;').replace(/"/g, '&quot;');

                let btnAcao;
                if (temProposta) {
                    btnAcao = `<div style="display:flex;gap:4px;"><button class="btn btn-ver" onclick='verProposta(${leadJson})'>📄 VER</button><button class="btn btn-ver" style="padding:2px 6px;" onclick='reverificarLead(${leadJson}, this)' title="Re-verificar Infraestrutura">🔄</button></div>`;
                } else {
                    btnAcao = `<div style="display:flex;gap:4px;"><button class="btn btn-ia" onclick='gerarPropostaIA(${leadJson})'>✨ ANALISAR</button><button class="btn btn-ver" style="padding:2px 6px;" onclick='reverificarLead(${leadJson}, this)' title="Re-verificar Infraestrutura">🔄</button></div>`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-size:0.7rem; color:#666; white-space:nowrap;">${escapeHTML(dt)}</td>
                    <td style="color:var(--cyan); font-weight:bold;">${escapeHTML(lead.dominio) || '—'}</td>
                    <td><span class="badge ${classeScore}">${escapeHTML(lead.score) || '—'}</span></td>
                    <td><span class="badge ${sslClass}">${escapeHTML(lead.status_ssl) || '—'}</span></td>
                    <td style="font-size:0.75rem;">${escapeHTML(lead.reputacao) || '—'}</td>
                    <td style="font-size:0.75rem; color:#888;">${escapeHTML(lead.velocidade) || '—'}</td>
                    <td style="font-size:0.72rem; color:#888; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHTML(lead.plataforma) || '—'}</td>
                    <td style="font-size:0.7rem; color:#666;">${escapeHTML(lead.ip_usuario) || '—'}<br>${escapeHTML(lead.localizacao) || ''}</td>
                    <td>${lead.email ? `<span class="badge badge-email">${escapeHTML(lead.email)}</span>` : '<span style="color:#555;">—</span>'}</td>
                    <td>${btnAcao}</td>
                `;
                corpo.appendChild(tr);
            });
        }

        function atualizarStats(leads) {
            document.getElementById('statTotal').textContent = leads.length;
            document.getElementById('statCriticos').textContent = leads.filter(l => l.score === 'Crítico').length;
            document.getElementById('statEmails').textContent = leads.filter(l => l.email).length;
            document.getElementById('statPropostas').textContent = leads.filter(l => l.detalhes_tecnicos && l.detalhes_tecnicos.trim()).length;
        }

        // ========== RE-VERIFICAR LEAD ==========
        async function reverificarLead(lead, btn) {
            btn.innerText = "⏳";
            btn.disabled = true;
            try {
                const dominio = lead.dominio;
                const start = Date.now();
                
                const [dmarcData, spfData, bimiData, mxData] = await Promise.all([
                    fetch(`https://dns.google/resolve?name=_dmarc.${dominio}&type=TXT`).then(r => r.json()).catch(() => ({})),
                    fetch(`https://dns.google/resolve?name=${dominio}&type=TXT`).then(r => r.json()).catch(() => ({})),
                    fetch(`https://dns.google/resolve?name=default._bimi.${dominio}&type=TXT`).then(r => r.json()).catch(() => ({})),
                    fetch(`https://dns.google/resolve?name=${dominio}&type=MX`).then(r => r.json()).catch(() => ({}))
                ]);

                const temDmarc = !!(dmarcData.Answer);
                const temSpf = spfData.Answer ? spfData.Answer.some(a => (a.data || '').includes('v=spf1')) : false;
                const temBimi = !!(bimiData.Answer && bimiData.Answer.length > 0);

                let provedor = "Desconhecido";
                if (mxData.Answer) {
                    const mxStr = mxData.Answer.map(a => a.data).join(' ').toLowerCase();
                    if (mxStr.includes('google')) provedor = "Google Workspace";
                    else if (mxStr.includes('outlook') || mxStr.includes('protection')) provedor = "Microsoft 365";
                    else if (mxStr.includes('locaweb')) provedor = "Locaweb";
                    else if (mxStr.includes('titan')) provedor = "Titan Mail";
                    else if (mxStr.includes('zoho')) provedor = "Zoho Mail";
                    else if (mxStr.includes('hostgator')) provedor = "HostGator";
                    else provedor = "Outro Provedor";
                } else {
                    provedor = "Sem E-mail (MX)";
                }
                
                let sslOk = false;
                try {
                    const ctrl = new AbortController();
                    setTimeout(() => ctrl.abort(), 3500);
                    await fetch(`https://${dominio}`, { mode: 'no-cors', signal: ctrl.signal });
                    sslOk = true;
                } catch (e) { sslOk = false; }
                
                const duration = (Date.now() - start) / 1000;
                
                let isWordPress = false;
                try {
                    isWordPress = await new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => resolve(true);
                        img.onerror = () => resolve(false);
                        img.src = `https://${dominio}/wp-includes/images/w-logo-blue.png`;
                        setTimeout(() => resolve(false), 2500);
                    });
                } catch(e) { }

                let basePlataforma = isWordPress ? "WordPress (Análise de Vulnerabilidade recomendada)" : "Infraestrutura Proprietária / Cloud";
                let plataforma = `${basePlataforma} | E-mail: ${provedor} | SPF: ${temSpf ? 'Ok' : 'Falha'} | BIMI: ${temBimi ? 'Ok' : 'Ausente'}`;
                
                let totalAlertas = 0;
                try {
                    const { data } = await _supabase.functions.invoke('rapid-worker', { body: { domain: dominio } });
                    totalAlertas = data?.data?.attributes?.last_analysis_stats ? (data.data.attributes.last_analysis_stats.malicious + data.data.attributes.last_analysis_stats.suspicious) : 0;
                } catch(e) {}
                
                let score = (sslOk && temDmarc && totalAlertas === 0) ? "A+" : "Crítico";
                const velStr = `${duration.toFixed(1)}s`;
                
                const { error } = await _supabase.from('leads').update({
                    score: score,
                    status_ssl: sslOk ? "Ativo" : "Falha",
                    reputacao: totalAlertas > 0 ? "Alertas Detectados" : "Limpo",
                    velocidade: velStr,
                    plataforma: plataforma
                }).eq('id', lead.id);
                
                if (error) throw error;
                
                carregarLeads(); // recarrega a tabela atualizada
            } catch (e) {
                console.error(e);
                alert("Erro ao reverificar.");
                btn.innerText = "🔄";
                btn.disabled = false;
            }
        }

        // ========== GERAR PROPOSTA IA ==========
        async function gerarPropostaIA(lead) {
            const apiKey = CHAVE_IA_AUTOMATICA || document.getElementById('geminiKey').value.trim();
            if (!apiKey) return alert("Configure a API KEY do Gemini!");

            _leadAtual = lead;
            document.getElementById('modalIA').style.display = 'block';
            document.getElementById('statusIA').innerText = "⏳ O Analista está redigindo a proposta...";
            document.getElementById('textoProposta').value = "Processando...";

            const prompt = `Atue como Wiliam Longo, Especialista em Cibersegurança da WL TEC.
Telefone/WhatsApp: 11 99531-4831 | Email: contato@wl.tec.br | Site: wl.tec.br

Escreva um dossiê técnico e comercial contendo EXATAMENTE 3 seções, rigorosamente separadas pela tag secreta [DIVISAO_WL]. Não escreva nada antes da primeira tag.

[DIVISAO_WL]
1. E-MAIL DE PROSPECÇÃO (Cold Mail)
Escreva um e-mail persuasivo, agressivo comercialmente e curto (máx 3 parágrafos) para o diretor da empresa dona do domínio **${lead.dominio}**. Vá direto ao ponto, cite os riscos encontrados na plataforma (ex: falta de SPF/BIMI) e chame para uma reunião da WL TEC. Assine como William Longo.

[DIVISAO_WL]
2. PROPOSTA COMERCIAL COMPLETA (PDF)
Escreva uma proposta estruturada e formal contendo: Diagnóstico Técnico Detalhado, Riscos Identificados de forma técnica, Plano de Ação (solução Blindagem Digital) e Investimento sugerido. Use Markdown.

[DIVISAO_WL]
3. GUIA TÉCNICO INTERNO DE CORREÇÃO (SOP)

                const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${destinatario}&su=${assunto}&body=${body}`;
